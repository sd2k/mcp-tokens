[package]
name = "mcp-tokens"
version = "0.2.2"
edition = "2024"
description = "Analyze token usage of MCP servers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sd2k/mcp-tokens"
rust-version = "1.88.0"

[dependencies]
# MCP client
rmcp = { version = "0.11", features = ["client", "transport-child-process", "transport-io"] }

# Token counting
tiktoken-rs = "0.9"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for Anthropic API
reqwest = { version = "0.12", features = ["json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async
async-trait = "0.1"
futures = "0.3"

# Progress bars
indicatif = "0.17"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
